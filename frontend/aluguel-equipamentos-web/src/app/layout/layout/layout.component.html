<div class="layout">

  <header class="cabecalho">

    <button type="button" class="botao-menu" (click)="alternarMenu()" [attr.aria-expanded]="menuAberto"
      aria-controls="menu-principal" aria-label="Abrir ou fechar menu">
      {{ menuAberto ? '✕' : '☰' }}
    </button>

    <div class="marca-sistema">
      <span class="icone-marca">🔧</span>

      <div class="texto-marca">
        <strong>Aluguel de Equipamentos</strong>
        <small>Painel administrativo</small>
      </div>
    </div>

    <div class="area-usuario">
      @if (usuario) {
      <div class="informacoes-usuario">
        <span>{{ usuario.nome }}</span>
        <small>{{ usuario.perfil }}</small>
      </div>
      }

      <button type="button" class="botao-sair" (click)="sair()">
        Sair
      </button>
    </div>
  </header>

  <div class="corpo">


    <aside id="menu-principal" class="menu-lateral" [class.menu-aberto]="menuAberto">
      <nav aria-label="Menu principal">

        <ul>
          <li class="titulo-grupo">OPERAÇÕES</li>

          <!-- RESERVAS -->
          <li>
            <a routerLink="/reservas" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()">
              📅 Reservas
            </a>
          </li>

                    <!-- RETIRADAS -->
          <li>
            <a routerLink="/retiradas" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()">
             📦 Retiradas
            </a>
          </li>


          <li class="titulo-grupo">CADASTROS</li>
          <!-- CLIENTES -->
          <li>
            <a routerLink="/clientes" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()">
              👥 Clientes
            </a>
          </li>

          <!-- CATEGORIAS -->
          <li>
            <a routerLink="/categorias" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()">
              📂 Categorias
            </a>
          </li>

          <!-- EQUIPAMENTOS -->
          <li>
            <a routerLink="/equipamentos" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
              (click)="fecharMenu()">
              🔧 Equipamentos
            </a>
          </li>

        </ul>
      </nav>
    </aside>


    <main class="conteudo">
      <router-outlet></router-outlet>
    </main>
  </div>


</div>
