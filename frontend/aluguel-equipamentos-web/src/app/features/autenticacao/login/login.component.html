
<div class="pagina-login">

  <section class="apresentacao-login">
    <div class="marca-login">🔧</div>

    <h1>Aluguel de Equipamentos</h1>

    <p>
      Gerencie clientes, equipamentos e reservas
      de forma simples e organizada.
    </p>
  </section>

  <section class="area-login">
    <div class="cartao-login">

      <h2>Bem-vindo!</h2>
      <p class="subtitulo-login">
        Entre com suas credenciais para acessar o sistema.
      </p>

      <form [formGroup]="formularioLogin" (ngSubmit)="entrar()">

        <div class="campo-login">
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="Digite seu e-mail"
          />
        </div>

        <div class="campo-login">
          <label for="senha">Senha</label>
          <input
            id="senha"
            type="password"
            formControlName="senha"
            autocomplete="current-password"
            placeholder="Digite sua senha"
          />
        </div>

        @if (mensagemErro) {
          <div class="alerta-login" role="alert">
            {{ mensagemErro }}
          </div>
        }

        <button type="submit" [disabled]="autenticando">
          {{ autenticando ? 'Entrando...' : 'Entrar no sistema' }}
        </button>

      </form>
    </div>
  </section>

</div>
